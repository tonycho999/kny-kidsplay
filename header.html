<!-- ⭐️ 로고 처리 스크립트 -->
<script id="kp-logo-script">
(function () {
    if (window.__kpLogoRun) return;   // 두 번 실행 방지
    window.__kpLogoRun = true;

    // ⭐️ Blogger 설정값 (라벨이 바뀌면 여기만 수정)
    var BLOG_URL = 'https://kny-company.blogspot.com';
    var SITE_LABEL = 'kny-kidsplay';
    var CACHE_KEY = 'kidsplay_project_name';

    var logo = document.getElementById('dynamic-logo-text');
    if (!logo) return;

    function applyName(name) {
        if (!name) return;
        logo.textContent = name;
        // 브라우저 탭 제목: "예약하기" → "예약하기 - 프로젝트명"
        var base = (document.title || '').split(' - ')[0].trim();
        document.title = base && base !== name ? base + ' - ' + name : name;
    }

    // 1) 지난번에 받아둔 이름이 있으면 먼저 표시
    try { applyName(localStorage.getItem(CACHE_KEY)); } catch (e) {}

    // 본문 HTML에서 첫 줄 글자만 뽑기
    function firstLine(html) {
        var div = document.createElement('div');
        div.innerHTML = String(html || '')
            .replace(/<br\s*\/?>/gi, '\n')
            .replace(/<\/(p|div|li|h[1-6])>/gi, '\n');
        var lines = (div.textContent || '').split('\n')
            .map(function (l) { return l.replace(/\u00a0/g, ' ').trim(); })
            .filter(Boolean);
        return lines[0] || '';
    }

    // 2) Blogger에서 최신 프로젝트명 받기 (JSONP)
    var cb = '__kpLogoCb_' + Date.now();
    var s = document.createElement('script');
    window[cb] = function (data) {
        try {
            var entries = (data.feed && data.feed.entry) || [];
            var post = entries.find(function (e) {
                var labelOk = (e.category || []).some(function (c) { return c.term === SITE_LABEL; });
                var title = ((e.title && e.title.$t) || '').replace(/\s/g, '');
                return labelOk && title === '프로젝트명';
            });
            if (post) {
                var name = firstLine((post.content && post.content.$t) || (post.summary && post.summary.$t));
                if (name) {
                    applyName(name);
                    try { localStorage.setItem(CACHE_KEY, name); } catch (e) {}
                }
            } else {
                // ⭐️ 프로젝트명 글이 삭제/임시저장되면 예전 이름도 지움
                logo.textContent = '';
                try { localStorage.removeItem(CACHE_KEY); } catch (e) {}
            }
        } finally {
            delete window[cb];
            s.remove();
        }
    };
    s.onerror = function () { delete window[cb]; s.remove(); };
    s.src = BLOG_URL + '/feeds/posts/default/-/' + encodeURIComponent(SITE_LABEL) +
            '?alt=json-in-script&max-results=150&orderby=published&callback=' + cb + '&_=' + Date.now();
    document.body.appendChild(s);
})();
</script>

<!-- ⭐️ innerHTML로 불러와도 위 스크립트가 실행되게 하는 장치 (지우지 마세요) -->
