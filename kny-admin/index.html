<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>물놀이장 예약관리 시스템</title>
    
    <!-- ⭐️ 분리된 CSS 파일들 불러오기 -->
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="css/admin_cms.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
</head>
<body>
    <header class="admin-header">
        <h1>⚙️ 물놀이장 예약관리 시스템</h1>
        <a href="../index.html" class="home-btn">홈페이지로 돌아가기</a>
    </header>

    <main class="admin-container">
        <div class="tab-menu">
            <button class="tab-btn active" onclick="switchTab('reservation-tab', this)">📋 예약 내역 관리</button>
            <button class="tab-btn" onclick="switchTab('homepage-tab', this)">🏠 홈페이지 설정</button>
            <button class="tab-btn" onclick="switchTab('reserve-setting-tab', this)">⏰ 예약 일정/회차 설정</button>
            <button class="tab-btn" onclick="switchTab('popup-tab', this)">📢 팝업 및 우천 관리</button>
        </div>

        <div id="reservation-tab" class="panel active"></div>
        <div id="homepage-tab" class="panel"></div>
        <div id="reserve-setting-tab" class="panel"></div>
        <div id="popup-tab" class="panel"></div>
    </main>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

    <script src="js/admin_cms.js"></script>
</body>
</html>
