<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>물놀이장 예약관리 시스템</title>
    <link rel="stylesheet" href="../css/admin.css">
    <!-- ⭐️ 분리된 커스텀 CSS 불러오기 -->
    <link rel="stylesheet" href="css/admin_cms.css">
    <!-- 글쓰기 에디터(Quill) 불러오기 -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
</head>
<body>
    <header class="admin-header">
        <h1>⚙️ 물놀이장 예약관리 시스템</h1>
        <a href="../index.html" class="home-btn">홈페이지로 돌아가기</a>
    </header>

    <main class="admin-container">
        <!-- 탭 버튼 영역 -->
        <div class="tab-menu">
            <button class="tab-btn active" onclick="switchTab('reservation-tab', this)">📋 예약 내역 관리</button>
            <button class="tab-btn" onclick="switchTab('homepage-tab', this)">🏠 홈페이지 설정</button>
            <button class="tab-btn" onclick="switchTab('reserve-setting-tab', this)">⏰ 예약 일정/회차 설정</button>
            <button class="tab-btn" onclick="switchTab('popup-tab', this)">📢 팝업 및 우천 관리</button>
        </div>

        <!-- HTML 조각들이 들어갈 빈 상자들 -->
        <div id="reservation-tab" class="panel active"></div>
        <div id="homepage-tab" class="panel"></div>
        <div id="reserve-setting-tab" class="panel"></div>
        <div id="popup-tab" class="panel"></div>
    </main>

    <!-- 에디터 스크립트 로드 -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <!-- 기존 예약관리용 자바스크립트 -->
    <script src="../js/admin.js"></script>
    
    <script>
        // ⭐️ 분리된 4개의 HTML 파일을 비동기로 불러와서 끼워넣는 함수
        async function loadTabs() {
            const tabs = [
                { id: 'reservation-tab', file: 'tabs/reserve_list.html' },
                { id: 'homepage-tab', file: 'tabs/homepage_setting.html' },
                { id: 'reserve-setting-tab', file: 'tabs/reserve_setting.html' },
                { id: 'popup-tab', file: 'tabs/popup_setting.html' }
            ];

            // 파일들을 차례대로 불러와서 HTML 안에 집어넣기
            for (const tab of tabs) {
                try {
                    const res = await fetch(tab.file);
                    const html = await res.text();
                    document.getElementById(tab.id).innerHTML = html;
                } catch (e) {
                    console.error("탭 로드 실패:", tab.file);
                }
            }

            // HTML이 다 그려진 후에! 에디터를 초기화해야 에러가 안 납니다.
            initEditors();
            
            // ⭐️ 탭이 다 불러와지면 DB에서 장소/회차 옵션 목록 가져와서 콤보박스에 채우기
            loadDynamicOptions();
        }

        // ⭐️ 탭 전환 함수
        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.panel').forEach(panel => panel.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');
        }

        // ⭐️ 에디터 초기화 함수
        function initEditors() {
            var editorOptions = {
                theme: 'snow',
                modules: { toolbar: [ [{ 'header': [1, 2, 3, false] }], ['bold', 'italic', 'underline'], [{ 'color': [] }, { 'background': [] }], [{ 'align': [] }], ['link'] ] }
            };

            // 홈페이지 설정 탭 에디터
            new Quill('#editor-main-page', editorOptions);
            new Quill('#editor-period', editorOptions);
            new Quill('#editor-guide', editorOptions);

            // 팝업 설정 탭 에디터
            new Quill('#editor-popup-main', editorOptions);
            new Quill('#editor-popup-guide', editorOptions);
            new Quill('#editor-popup-period', editorOptions);
            new Quill('#editor-popup-reserve', editorOptions);
            new Quill('#editor-popup-location', editorOptions);
        }

        // ⭐️ DB에서 행사명, 장소, 회차를 가져와서 콤보박스에 동적으로 채워넣는 함수
        async function loadDynamicOptions() {
            try {
                // (주의) 백엔드 Worker에 /api/admin/init-options 라우트가 존재해야 합니다.
                const response = await fetch('/api/admin/init-options');
                const data = await response.json();

                if (data.success) {
                    const locSelect = document.getElementById('filterLocation');
                    const timeSelect = document.getElementById('filterTime');

                    // 1. 행사명/장소명 채우기
                    if (locSelect) {
                        locSelect.innerHTML = ''; // "불러오는 중..." 임시 문구 삭제
                        
                        // 장소(location)가 여러 개 등록되어 있으면 '사이트명 + 장소명'으로 결합하여 표시
                        if (data.locations && data.locations.length > 0) {
                            data.locations.forEach(loc => {
                                locSelect.innerHTML += `<option value="${loc.name}">[${data.siteName}] ${loc.name}</option>`;
                            });
                        } else {
                            // 장소가 아직 DB에 없으면 기본 사이트명만 표시
                            locSelect.innerHTML = `<option value="${data.siteName}">${data.siteName}</option>`;
                        }
                    }

                    // 2. 회차(Time Slots) 채우기
                    if (timeSelect) {
                        timeSelect.innerHTML = '<option value="">모든 회차</option>'; // 전체 보기 옵션 유지
                        
                        // DB에 저장된 회차가 있으면 시간과 함께 표시
                        if (data.timeSlots && data.timeSlots.length > 0) {
                            data.timeSlots.forEach(slot => {
                                // value에는 slot_name이 들어가고, 화면에는 시간대까지 포함해서 보여줌
                                timeSelect.innerHTML += `<option value="${slot.slot_name}">${slot.slot_name} (${slot.start_time}~${slot.end_time})</option>`;
                            });
                        }
                    }
                }
            } catch (error) {
                console.error("옵션 데이터 로드 중 오류 발생 (DB API 확인 필요):", error);
            }
        }

        // ⭐️ 임시 저장 버튼 함수
        function saveCmsData(type) {
            alert("[" + type + "] 영역의 설정을 저장했습니다.\n(현재는 UI 구성 단계이며, 추후 DB 연동이 진행됩니다.)");
        }

        // ⭐️ 페이지가 켜지면 조각 파일들을 불러오기 시작
        document.addEventListener('DOMContentLoaded', loadTabs);
    </script>
</body>
</html>
