<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>물놀이장 예약관리 시스템</title>

    <!-- 기존 CSS -->
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="css/admin_cms.css?v=20260813">

    <!-- ⭐️ Blogger 연동 화면 전용 스타일 -->
    <style>
        .bl-toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:15px; }
        .bl-btn { display:inline-block; padding:9px 16px; border-radius:6px; color:#fff; font-weight:bold; text-decoration:none; border:none; cursor:pointer; font-size:14px; }
        .bl-btn.create { background:#2ecc71; }
        .bl-btn.manage { background:#f39c12; }
        .bl-btn.refresh { background:#7f8c8d; }
        .bl-btn.edit { background:#3498db; padding:6px 12px; font-size:13px; }
        .bl-btn.new { background:#2ecc71; padding:6px 12px; font-size:13px; }
        .bl-notice { background:#fff8e1; border-left:4px solid #f39c12; padding:12px 15px; color:#555; font-size:0.93rem; line-height:1.8; margin-bottom:20px; border-radius:4px; }
        .bl-table { width:100%; border-collapse:collapse; font-size:14px; }
        .bl-table th, .bl-table td { border:1px solid #e1e8ed; padding:10px; text-align:center; vertical-align:middle; }
        .bl-table th { background:#0056b3; color:#fff; }
        .bl-ok { color:#28a745; font-weight:bold; }
        .bl-ng { color:#dc3545; font-weight:bold; }
        .bl-warn { color:#e67e22; font-size:12px; display:block; margin-top:3px; }
        .bl-tag { display:inline-block; background:#e8f4fd; color:#0056b3; border-radius:4px; padding:2px 8px; margin:2px; font-size:12px; font-weight:bold; }
        .bl-tag.bad { background:#fdecea; color:#dc3545; }
        .bl-example { background:#f8f9fa; border:1px dashed #ccc; padding:12px; border-radius:6px; font-family:monospace; font-size:13px; white-space:pre-line; color:#333; }
    </style>
</head>
<body>
    <header class="admin-header">
        <h1>⚙️ <span id="admin-project-name">물놀이장 예약관리 시스템</span></h1>
        <a href="../index.html" class="home-btn">홈페이지로 돌아가기</a>
    </header>

    <main class="admin-container">
        <div class="tab-menu">
            <button class="tab-btn active" onclick="switchTab('reservation-tab', this)">📋 예약 내역 관리</button>
            <button class="tab-btn" onclick="switchTab('homepage-tab', this)">🏠 홈페이지 콘텐츠</button>
            <button class="tab-btn" onclick="switchTab('reserve-setting-tab', this)">⏰ 예약 일정/회차 설정</button>
            <button class="tab-btn" onclick="switchTab('popup-tab', this)">📢 팝업 및 우천 관리</button>
        </div>

        <div id="reservation-tab" class="panel active"></div>
        <div id="homepage-tab" class="panel"></div>
        <div id="reserve-setting-tab" class="panel"></div>
        <div id="popup-tab" class="panel"></div>
    </main>

    <!-- ⭐️ Quill 에디터는 더 이상 사용하지 않음 -->
    <!-- admin.js(예약 내역)는 admin_cms.js가 탭 로딩 후 자동으로 불러옵니다 -->
    <script src="js/admin_cms.js?v=20260813"></script>
</body>
</html>
