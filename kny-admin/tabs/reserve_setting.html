<h2>예약 일정 및 회차 설정</h2>

<div class="cms-section">
    <h3>📍 장소 관리</h3>
    <p style="font-size: 0.9rem; color: #666;">운영할 장소를 추가하세요.</p>
    <div class="form-group" style="display: flex; gap: 10px;">
        <input type="text" id="new-location-name" placeholder="새 장소명 입력 (예: 과천 갈현동)">
        <button onclick="addLocation()" style="padding: 10px 20px; background: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer;">추가</button>
    </div>
    <!-- 추가된 장소 목록 표시 -->
    <ul id="location-list" style="list-style:none; padding:0; margin-top:10px; border-top:1px solid #eee; padding-top:10px;"></ul>
</div>

<div class="cms-section">
    <h3>⏰ 회차 관리 (시간표)</h3>
    <p style="font-size: 0.9rem; color: #666;">장소를 선택하고 해당 장소의 예약 회차와 정원을 추가합니다.</p>
    <div class="form-group">
        <select id="slot-location-select" style="width:100%; padding:8px;"><option value="">장소 선택</option></select>
    </div>
    <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center; background:#f8f9fa; padding:15px; border-radius:6px; border:1px solid #ddd;">
        <input type="text" id="new-slot-name" placeholder="회차명 (예: 1부)" style="flex:1; padding:8px;">
        시작:<input type="time" id="new-slot-start" style="padding:8px;">
        종료:<input type="time" id="new-slot-end" style="padding:8px;">
        <input type="number" id="new-slot-capacity" placeholder="정원(명)" style="width:80px; padding:8px;">
        <button onclick="addTimeSlot()" style="padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer;">회차 추가</button>
    </div>
    <!-- 추가된 회차 목록 표시 -->
    <ul id="slot-list" style="list-style:none; padding:0; margin-top:10px;"></ul>
</div>

<div class="cms-section">
    <h3>🗓️ 예약 오픈 일정 관리</h3>
    <p style="font-size: 0.9rem; color: #666;">해당 장소의 특정 이용일 범위 예약이 '언제' 열릴지 설정합니다.</p>
    <div class="form-group">
        <select id="rule-location-select" style="width:100%; padding:8px;"><option value="">장소 선택</option></select>
    </div>
    <div style="display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; background:#f8f9fa; padding:15px; border-radius:6px; border:1px solid #ddd;">
        <div class="form-group" style="flex:1; margin:0;"><label>이용 시작일</label><input type="date" id="rule-start-date"></div>
        <div class="form-group" style="flex:1; margin:0;"><label>이용 종료일</label><input type="date" id="rule-end-date"></div>
        <div class="form-group" style="flex:1; margin:0;"><label>예약 오픈 일시</label><input type="datetime-local" id="rule-open-datetime"></div>
        <button onclick="addReservationRule()" style="padding: 10px 20px; background: #f39c12; color: white; border: none; border-radius: 4px; cursor: pointer;">규칙 추가</button>
    </div>
    <!-- 추가된 규칙 목록 표시 -->
    <ul id="rule-list" style="list-style:none; padding:0; margin-top:10px;"></ul>
</div>

<div class="cms-section">
    <h3>📝 주소 입력란 안내 문구 (선택)</h3>
    <p style="font-size: 0.9rem; color: #666;">장소별로 예약 폼에 표시할 주소 안내 문구를 설정합니다.</p>
    <div class="form-group" style="display:flex; gap:10px;">
        <select id="notice-location-select" onchange="loadNoticeText()" style="width:150px; padding:8px;"><option value="">장소 선택</option></select>
        <input type="text" id="location-notice-text" placeholder="예: *과천시민 확인용 주소를 넣어주세요." style="flex:1; padding:8px;">
        <button onclick="updateLocationNotice()" style="padding: 10px 20px; background: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer;">저장</button>
    </div>
</div>
