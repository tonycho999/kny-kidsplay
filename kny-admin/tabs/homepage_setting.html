<h2>홈페이지 기본 내용 수정</h2>
<div class="cms-section">
    <h3>1. 업체명 / 타이틀 설정</h3>
    <div class="form-group">
        <label>홈페이지 최상단 메뉴바에 보일 이름</label>
        <input type="text" id="cms-site-title" placeholder="예: 2026 성북문화바캉스 어린이 물놀이장">
    </div>
</div>
<div class="cms-section">
    <h3>2. [첫 화면(메인)] 본문 내용 수정</h3>
    <p style="font-size: 0.9rem; color: #666; margin-bottom: 15px;">홈페이지 접속 시 가장 먼저 보이는 환영 문구나 메인 공지사항을 작성하세요.</p>
    <div id="editor-main-page" style="height: 200px; background: white;"></div>
</div>
<div class="cms-section">
    <h3>3. [운영기간안내] 페이지 수정</h3>
    <div id="editor-period" style="height: 200px; background: white;"></div>
</div>
<div class="cms-section">
    <h3>4. [이용안내] 페이지 수정</h3>
    <div id="editor-guide" style="height: 200px; background: white;"></div>
</div>
<div class="cms-section">
    <h3>5. [오시는길] 위치 및 지도 설정</h3>
    <div class="form-group"><label>지도 이미지 주소 (또는 외부 링크)</label><input type="text" placeholder="예: /images/map.png"></div>
    <div class="form-group"><label>네이버 지도 연동용 정확한 도로명 주소</label><input type="text" placeholder="예: 서울특별시 성북구 화랑로 18자길 13"></div>
</div>
<button class="btn-submit-cms" onclick="saveCmsData('homepage')">홈페이지 설정 저장하기</button>
