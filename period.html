<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>홈</title>
    <link rel="stylesheet" href="css/style.css?v=20260813">
</head>
<!-- ⭐️ data-page 이름이 Blogger 글 제목과 같아야 합니다 -->
<body data-page="운영기간안내">

    <div id="header-placeholder"></div>

    <main>
        <div id="kp-page-content">
            <div class="kp-loading">불러오는 중...</div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script>
        async function loadIncludes() {
            // innerHTML로 넣은 <script>를 실제로 실행시키기
            function runScripts(box) {
                box.querySelectorAll('script').forEach(old => {
                    const s = document.createElement('script');
                    s.textContent = old.textContent;
                    old.replaceWith(s);
                });
            }
            try {
                const headerBox = document.getElementById('header-placeholder');
                headerBox.innerHTML = await (await fetch('header.html?v=' + Date.now())).text();
                runScripts(headerBox);

                const footerBox = document.getElementById('footer-placeholder');
                footerBox.innerHTML = await (await fetch('footer.html?v=' + Date.now())).text();
                runScripts(footerBox);

                const menuToggle = document.getElementById('menuToggle');
                const navMenu = document.getElementById('navMenu');
                if (menuToggle && navMenu) {
                    menuToggle.addEventListener('click', () => navMenu.classList.toggle('active'));
                }
            } catch (e) { console.error('헤더/푸터 로드 실패', e); }
        }
        loadIncludes();
    </script>

    <!-- ⭐️ Blogger 본문 + 팝업 처리 -->
    <script src="js/blogger-content.js?v=20260813"></script>
</body>
</html>
